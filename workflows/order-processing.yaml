description: 'Pilot: simplified order check'
process_id: order-processing
tasks:
    - description: Initialize the order processing pipeline
      task_id: start
      type: START
    - config:
        description: Validates the incoming order data
        headers:
            X-Service: order-validation
        method: POST
        url: https://httpbin.org/post
      description: Validate order details and check inventory via external API
      group: system
      input_schema: |
        {
          "type": "object",
          "properties": {
            "order_id":    {"type": "string"},
            "items":       {"type": "array"},
            "customer_id": {"type": "string"}
          },
          "required": ["order_id"]
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "valid":            {"type": "boolean"},
            "inventory_status": {"type": "string"},
            "message":          {"type": "string"}
          }
        }
      task_id: validate_order
      type: SYSTEM
    - description: Operations team reviews the order before payment
      group: cashier
      input_schema: |
        {
          "type": "object",
          "properties": {
            "order_summary":      {"type": "string"},
            "validation_result":  {"type": "object"},
            "requires_attention": {"type": "string"}
          }
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "approved":       {"type": "boolean"},
            "reviewer_notes": {"type": "string"}
          }
        }
      task_id: manual_review
      type: HUMAN
    - description: Manager reviews the order before payment
      group: management
      input_schema: |
        {
          "type": "object",
          "properties": {
            "order_summary":      {"type": "string"},
            "validation_result":  {"type": "object"},
            "requires_attention": {"type": "string"}
          }
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "approved":       {"type": "boolean"},
            "reviewer_notes": {"type": "string"}
          }
        }
      task_id: manager_review
      type: HUMAN
    - config:
        headers:
            X-Service: payment-processing
        method: POST
        url: https://httpbin.org/post
      description: Charge the customer for the approved order
      group: system
      input_schema: |
        {
          "type": "object",
          "properties": {
            "order_id":       {"type": "string"},
            "amount":         {"type": "number"},
            "payment_method": {"type": "string"}
          },
          "required": ["order_id", "amount"]
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "transaction_id": {"type": "string"},
            "status":         {"type": "string"}
          }
        }
      task_id: process_payment
      type: SYSTEM
    - description: Finalize order processing
      task_id: end
      type: END
topology:
    - condition: always
      from: start
      to: validate_order
    - condition: order is valid and requires human review
      from: validate_order
      to: manual_review
    - condition: order is invalid and should be rejected
      from: validate_order
      to: end
    - condition: order amount exceeds $1000 — route to manager for approval before payment
      from: manual_review
      to: manager_review
    - condition: reviewer approved the order AND amount is $1000 or less
      from: manual_review
      to: process_payment
    - condition: reviewer rejected the order
      from: manual_review
      to: end
    - condition: manager approved the order
      from: manager_review
      to: process_payment
    - condition: manager rejected the order
      from: manager_review
      to: end
    - condition: payment completed or failed
      from: process_payment
      to: end
    - condition: fraud suspected
      from: validate_order
      to: manual_review
