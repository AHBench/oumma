    Notify Applicant:
        config:
            tool: mcp.telegram.send
            tool_config:
                bot_token: 123456:TEST-TOKEN
                chat_id: "42"
            tool_inputs:
                message: $message
        description: Notify the applicant via Telegram
        id: Notify Applicant
        type: SYSTEM
    Send Email Receipt:
        config:
            tool: mcp.gmail.send
            tool_config:
                api_key: gw-key-123
                from: no-reply@oumma.local
                gateway: https://mail.example.com/api/send
            tool_inputs:
                subject: $subject
                to: $email
        description: Send Email Receipt
        id: Send Email Receipt
        task_id: Send Email Receipt
        type: SYSTEM
    TestStep:
        description: TestStep
        group: CustRelations
        id: TestStep
        task_id: TestStep
        type: HUMAN
    Verify Applicant:
        description: Manual verification of the applicant
        group: CustRelations
        id: Verify Applicant
        type: HUMAN
    Webhook X:
        config:
            headers:
                X-Api-Key: k
            method: POST
            url: https://api.example.com/hook
        description: Webhook X
        id: Webhook X
        task_id: Webhook X
        type: SYSTEM
    end:
        description: End
        id: end
        type: END
    start:
        description: Start
        id: start
        type: START
topology:
    - condition: always
      from: start
      to: Verify Applicant
    - condition: always
      from: Verify Applicant
      to: Notify Applicant
    - condition: always
      from: Notify Applicant
      to: end
    - from: Verify Applicant
      to: Send Email Receipt
    - from: Verify Applicant
      to: Check Docs
    - condition: always
      from: Check Docs
      to: end
    - from: Verify Applicant
      to: Webhook X
    - condition: always
      from: Verify Applicant
      to: TestStep
    - condition: always
      from: TestStep
      to: end
