    user_id: 8c9fb880-38d9-48e1-8577-400850202679
    username: fake_admin
description: |
    Processus d'onboarding bancaire : vérification du dossier client, contrôle responsable, scoring d'interdiction automatique (DMN), décision manuelle éventuelle, appel aux APIs core banking, et vérification manuelle d'intégration. En cas de réponse défavorable, le dossier peut être résoumis ou rejeté définitivement.
end_task_ids:
    - end_success
    - end_refuse
process_id: onboarding
start_task_id: start
tasks:
    Controle Juriste:
        description: Contrôle du juriste sur la conformité légale du dossier
        group: Juriste
        id: Controle Juriste
        input_schema:
            properties:
                account:
                    type: object
                customer:
                    type: object
                department:
                    type: object
                employee_approval:
                    type: string
                form_id:
                    type: string
            required:
                - customer
                - account
                - employee_approval
            type: object
        output_schema:
            properties:
                juriste_approval:
                    enum:
                        - "Yes"
                        - "No"
                    type: string
                juriste_comment:
                    type: string
            required:
                - juriste_approval
            type: object
        type: HUMAN
    Controle Responsable:
        description: Contrôle du responsable d'agence sur le dossier soumis par l'employé
        group: Managers
        id: Controle Responsable
        input_schema:
            properties:
                account:
                    type: object
                accuracy:
                    type: number
                customer:
                    type: object
                department:
                    type: object
                employee_approval:
                    type: string
                form_id:
                    type: string
                manager_approval:
                    type: string
                manager_comment:
                    type: string
            required:
                - customer
                - account
                - employee_approval
            type: object
        output_schema:
            properties:
                manager_approval:
                    enum:
                        - "Yes"
                        - "No"
                    type: string
                manager_comment:
                    type: string
            required:
                - manager_approval
            type: object
        type: HUMAN
    Core Banking APIs:
        config:
            headers:
                X-Service: core-banking-apis
            method: POST
            url: https://httpbin.org/post
        description: |
            Appel aux APIs core banking (AccountAPI.testapicall) pour intégrer le client dans le système bancaire central — retourne les logs d'intégration
        id: Core Banking APIs
        input_schema:
            properties:
                account:
                    type: object
                cif:
                    type: object
                customer:
                    type: object
            required:
                - customer
                - account
                - cif
            type: object
        output_schema:
            properties:
                core_logs:
                    type: object
            required:
                - core_logs
            type: object
        type: SYSTEM
    Decision Manuelle:
        description: |
            Décision manuelle du responsable sur l'interdiction lorsque le score automatique ne conclut pas à une interdiction — le responsable peut confirmer ou infirmer l'interdiction
        group: Managers
        id: Decision Manuelle
        input_schema:
            properties:
                account:
                    type: object
                auto_interdiction:
                    type: boolean
                customer:
                    type: object
                department:
                    type: object
                form_id:
                    type: string
                manager_comment:
                    type: string
                manual_interdiction:
                    type: string
            required:
                - customer
                - account
            type: object
        output_schema:
            properties:
                auto_interdiction:
                    type: boolean
                manual_interdiction:
                    enum:
                        - Non
                        - ""
                    type: string
            type: object
        type: HUMAN
    Reponse Defavorable:
        description: |
            Notification d'une réponse défavorable au client — l'employé peut proposer une re-soumission du dossier ou clore définitivement le dossier
        group: CustRelations
        id: Reponse Defavorable
        input_schema:
            properties:
                account:
                    type: object
                customer:
                    type: object
                department:
                    type: object
                employee_approval:
                    type: string
                form_id:
                    type: string
                manager_approval:
                    type: string
                manager_comment:
                    type: string
            required:
                - customer
                - account
            type: object
        output_schema:
            properties:
                employee_approval:
                    enum:
                        - "Yes"
                        - "No"
                    type: string
            required:
                - employee_approval
            type: object
        type: HUMAN
    Scoring Interdiction:
        config:
            headers:
                X-Service: scoring-interdiction
            method: POST
            url: https://httpbin.org/post
        description: |
            Scoring d'interdiction par règle métier DMN (interdiction.dmn) — détermine automatiquement si le client est interdit bancaire
        id: Scoring Interdiction
        input_schema:
            properties:
                account:
                    type: object
                accuracy:
                    type: number
                customer:
                    type: object
            required:
                - customer
                - account
                - accuracy
            type: object
        output_schema:
            properties:
                auto_interdiction:
                    type: boolean
            required:
                - auto_interdiction
            type: object
        type: SYSTEM
    Verification Dossier:
        config:
            description: desc typed in dock window
            group: CustRelations
            id: Verification Dossier
            input_schema:
                properties:
                    account:
                        type: object
                    core_logs:
                        type: object
                    customer:
                        type: object
                    department:
                        type: object
                    form_id:
                        type: string
                required:
                    - customer
                    - account
                type: object
            output_schema:
                properties:
                    employee_approval:
                        enum:
                            - "Yes"
                            - "No"
                        type: string
                required:
                    - employee_approval
                type: object
            type: HUMAN
        description: desc typed in dock window
        group: CustRelations
        id: Verification Dossier
        input_schema:
            properties:
                account:
                    type: object
                core_logs:
                    type: object
                customer:
                    type: object
                department:
                    type: object
                form_id:
                    type: string
            required:
                - customer
                - account
            type: object
        output_schema:
            properties:
                employee_approval:
                    enum:
                        - "Yes"
                        - "No"
                    type: string
            required:
                - employee_approval
            type: object
        type: HUMAN
    Verification Integration:
        description: |
            Vérification manuelle du résultat de l'intégration core banking par le chargé de clientèle — validation finale avant clôture du dossier
        group: CustRelations
        id: Verification Integration
        input_schema:
            properties:
                account:
                    type: object
                accuracy:
                    type: number
                core_logs:
                    type: object
                customer:
                    type: object
                department:
                    type: object
                form_id:
                    type: string
                manager_approval:
                    type: string
                manager_comment:
                    type: string
            required:
                - customer
                - account
                - core_logs
            type: object
        type: HUMAN
    Verification Interdiction:
        config:
            headers:
                X-Service: verification-interdiction
            method: POST
            url: https://httpbin.org/post
        description: |
            Vérification de l'interdiction bancaire via l'API AccountAPI (opération checkInterdiction) — retourne un score de précision (accuracy)
        id: Verification Interdiction
        input_schema:
            properties:
                account:
                    type: object
                accuracy:
                    type: number
                customer:
                    type: object
            required:
                - customer
                - account
            type: object
        output_schema:
            properties:
                accuracy:
                    type: number
            type: object
        type: SYSTEM
    end_refuse:
        description: Fin du processus — dossier définitivement refusé
        id: end_refuse
        type: END
    end_success:
        description: Fin normale du processus — client intégré avec succès
        id: end_success
        type: END
    start:
        description: Démarrage du processus d'onboarding bancaire
        id: start
        type: START
topology:
    - condition: always
      from: start
      to: Verification Dossier
    - condition: always
      fork: true
      from: Verification Dossier
      to: Controle Responsable
    - condition: always
      fork: true
      from: Verification Dossier
      to: Controle Juriste
    - condition: |
        le responsable et le juriste approuvent tous les deux le dossier (manager_approval est "Yes" ET juriste_approval est "Yes")
      join: and
      join_from:
        - Controle Responsable
        - Controle Juriste
      to: Verification Interdiction
    - condition: |
        au moins l'un des contrôleurs rejette le dossier (manager_approval est "No" OU juriste_approval est "No")
      join: and
      join_from:
        - Controle Responsable
        - Controle Juriste
      to: Reponse Defavorable
    - condition: always
      from: Verification Interdiction
      to: Scoring Interdiction
    - condition: |
        le scoring automatique conclut à une interdiction (auto_interdiction est true) — réponse défavorable directe, sans décision manuelle
      from: Scoring Interdiction
      to: Reponse Defavorable
    - condition: |
        le scoring automatique ne conclut pas à une interdiction (auto_interdiction est false) et le score est faible — une décision manuelle est nécessaire
      from: Scoring Interdiction
      to: Decision Manuelle
    - condition: |
        la décision manuelle est "Yes" — le responsable valide, appel des API core banking et poursuite de l'onboarding
      from: Decision Manuelle
      to: Core Banking APIs
    - condition: |
        la décision manuelle est "No" — le client ne peut pas être onboardé, réponse défavorable
      from: Decision Manuelle
      to: Reponse Defavorable
    - condition: always
      from: Core Banking APIs
      to: Verification Integration
    - condition: always
      from: Verification Integration
      to: end_success
    - condition: |
        l'employé choisit de re-soumettre le dossier après correction (employee_approval est "Yes") — retour à la vérification du dossier
      from: Reponse Defavorable
      to: Verification Dossier
    - condition: |
        l'employé confirme le rejet définitif du dossier (employee_approval est "No")
      from: Reponse Defavorable
      to: end_refuse
