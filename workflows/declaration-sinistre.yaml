description: Claim declaration flow
process_id: declaration-sinistre
tasks:
    - description: Initialisation du processus de déclaration de sinistre
      task_id: start
      type: START
    - description: Saisie du dossier sinistre par l'employé d'agence
      group: EMPLOYEE_AGENCE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "compagnie_assurance": {"type": "string"}
          },
          "required": ["client", "compagnie_assurance"]
        }
      task_id: saisie_dossier_sinistre
      type: HUMAN
    - description: Analyse initiale du soupçon de fraude par le gestionnaire central
      group: GESTIONNAIRE_CENTRALE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: soupcon_de_fraude
      type: HUMAN
    - description: Déclaration formelle de fraude et qualification de l'état du dossier
      group: GESTIONNAIRE_CENTRALE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "fraude_valide":    {"type": "string", "enum": ["Oui", "Non"]},
            "dossier_incomplet":{"type": "string", "enum": ["Oui", "Non"]}
          },
          "required": ["fraude_valide", "dossier_incomplet"]
        }
      task_id: declaration_de_fraude
      type: HUMAN
    - description: Notification au client que le dossier est incomplet et demande de compléments
      group: EMPLOYEE_AGENCE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: dossier_incomplet
      type: HUMAN
    - description: Diligenter une enquête et coordination avec d'autres organismes
      group: GESTIONNAIRE_CENTRALE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: diligente_enquete
      type: HUMAN
    - description: Réception et analyse du rapport d'expertise fraude par l'expert
      group: EXPERT
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "fraude_valide": {"type": "string", "enum": ["Oui", "Non"]}
          },
          "required": ["fraude_valide"]
        }
      task_id: reception_expertise_fraude
      type: HUMAN
    - description: Traitement du dossier suite à fraude avérée par le gestionnaire central
      group: GESTIONNAIRE_CENTRALE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: fraude_averee
      type: HUMAN
    - description: Classement du dossier et engagement de poursuites judiciaires
      group: GESTIONNAIRE_CENTRALE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: classement_judiciaire
      type: HUMAN
    - description: Fin du processus – dossier classé pour fraude avérée
      task_id: end_fraud
      type: END
    - description: Constatation de l'absence de fraude et préparation du dossier d'indemnisation
      group: GESTIONNAIRE_CENTRALE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: absence_de_fraude
      type: HUMAN
    - description: Évaluation du risque global du sinistre par le comité d'évaluation
      group: COMITE_EVALUATION
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: evaluation_du_risque
      type: HUMAN
    - description: Sélection de l'expert et envoi du dossier pour expertise
      group: EMPLOYEE_AGENCE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: envoi_selection_expert
      type: HUMAN
    - description: Réception du dossier d'expertise par l'expert
      group: EXPERT
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "compagnie_assurance": {"type": "string"}
          }
        }
      task_id: reception_dossier_expertise
      type: HUMAN
    - description: Évaluation complète du dossier d'expertise par l'expert
      group: EXPERT
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: evaluation_expertise
      type: HUMAN
    - description: Approbation finale par le gestionnaire central avant traitement financier
      group: GESTIONNAIRE_CENTRALE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: approbation_gestionnaire
      type: HUMAN
    - config:
        headers:
            X-Service: validation-sys
        method: POST
        url: https://httpbin.org/post
      description: Validation automatique du dossier par le système interne ValidationSys
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude_valide":       {"type": "string"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"}
          },
          "required": ["client", "compagnie_assurance"]
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "validation_status":  {"type": "string", "enum": ["approved", "rejected"]},
            "validation_details": {"type": "object"}
          },
          "required": ["validation_status"]
        }
      task_id: validation_sys
      type: SYSTEM
    - description: Traitement et exécution du paiement de l'indemnisation au client
      group: EMPLOYEE_AGENCE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: traitement_paiement
      type: HUMAN
    - description: Notification finale du client sur le résultat de sa déclaration de sinistre
      group: EMPLOYEE_AGENCE
      input_schema: |
        {
          "type": "object",
          "properties": {
            "client":              {"type": "object"},
            "fraude":              {"type": "boolean"},
            "fraude_valide":       {"type": "string"},
            "dossier_incomplet":   {"type": "string"},
            "compagnie_assurance": {"type": "string"},
            "department":          {"type": "string"}
          }
        }
      task_id: notification_client
      type: HUMAN
    - description: Fin du processus – sinistre traité et client notifié
      task_id: end
      type: END
topology:
    - from: start
      to: saisie_dossier_sinistre
    - condition: le dossier présente un risque de fraude (fraude est vrai)
      from: saisie_dossier_sinistre
      to: soupcon_de_fraude
    - condition: le dossier ne présente pas de risque de fraude (fraude est faux)
      from: saisie_dossier_sinistre
      to: envoi_selection_expert
    - from: soupcon_de_fraude
      to: declaration_de_fraude
    - condition: le dossier est incomplet (dossier_incomplet est Oui)
      from: declaration_de_fraude
      to: dossier_incomplet
    - condition: le dossier est complet (dossier_incomplet est Non)
      from: declaration_de_fraude
      to: diligente_enquete
    - condition: le client a fourni les pièces manquantes, retour à la saisie du dossier
      from: dossier_incomplet
      to: saisie_dossier_sinistre
    - from: diligente_enquete
      to: reception_expertise_fraude
    - condition: la fraude est confirmée par l'expert (fraude_valide est Oui)
      from: reception_expertise_fraude
      to: fraude_averee
    - condition: la fraude est infirmée par l'expert (fraude_valide est Non)
      from: reception_expertise_fraude
      to: absence_de_fraude
    - from: fraude_averee
      to: classement_judiciaire
    - from: classement_judiciaire
      to: end_fraud
    - from: absence_de_fraude
      to: evaluation_du_risque
    - from: evaluation_du_risque
      to: approbation_gestionnaire
    - from: envoi_selection_expert
      to: reception_dossier_expertise
    - from: reception_dossier_expertise
      to: evaluation_expertise
    - from: evaluation_expertise
      to: approbation_gestionnaire
    - from: approbation_gestionnaire
      to: validation_sys
    - from: validation_sys
      to: traitement_paiement
    - from: traitement_paiement
      to: notification_client
    - from: notification_client
      to: end
